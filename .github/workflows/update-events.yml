name: Update Berkeley events

on:
  schedule:
    # Runs daily at 11:30 UTC = 4:30 AM Pacific = 5:00 PM IST
    - cron: "30 11 * * *"
  workflow_dispatch: {} # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest events
        run: node scraper.js
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}

      - name: Commit updated events.json (if changed)
        run: |
          git config user.name "events-bot"
          git config user.email "actions@github.com"
          git add site/events.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update events data ($(date -u +%Y-%m-%d))"
            git push
          fi
